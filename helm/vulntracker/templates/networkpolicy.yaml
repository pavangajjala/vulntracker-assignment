# Default deny for this pod, then allow only what is required.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vulntracker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller, only on the app port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS lookups.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The notify service, and nothing else.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.notifyPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.notifyPort }}