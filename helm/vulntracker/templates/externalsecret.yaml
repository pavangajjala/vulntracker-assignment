# Pulls the JWT signing key from AWS Secrets Manager into a Kubernetes Secret.
# Requires the External Secrets Operator and a ClusterSecretStore named in values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.storeRef.kind }}
    name: {{ .Values.secrets.storeRef.name }}
  target:
    name: {{ include "vulntracker.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: {{ .Values.secrets.jwtSecretKey.remoteKey }}